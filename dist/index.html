<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LUT試作 · color ribbon sketch</title><link rel="stylesheet" href="lut.css"></head>
<body>
<main>
<section class="drawing" aria-label="描画エリア">
<div class="toolbar"><div role="group" aria-label="ツール"><a class="icon-button" href="https://nagaokayama.github.io/color-ribbon-sketch-app/" title="既存版へ" aria-label="既存版へ" data-icon="back"><span>既存版へ</span></a><button data-tool="pen" data-icon="pen" title="ペン (B)" aria-label="ペン" aria-pressed="true"><span>ペン</span></button><button data-tool="eraser" data-icon="eraser" title="消しゴム (E)" aria-label="消しゴム" aria-pressed="false"><span>消しゴム</span></button><button data-tool="picker" data-icon="picker" title="スポイト (I)" aria-label="スポイト" aria-pressed="false"><span>スポイト</span></button></div><div><button id="undo" data-icon="undo" title="元に戻す" aria-label="元に戻す"><span>元に戻す</span></button><button id="redo" data-icon="redo" title="やり直す" aria-label="やり直す"><span>やり直す</span></button><button id="export" data-icon="export" title="PNG保存" aria-label="PNG保存"><span>PNG保存</span></button></div></div>
<div class="debug-controls" role="group" aria-label="デバッグ表示">
<button data-view="normal" aria-pressed="true" data-icon="pen">通常</button>
<button data-view="palette" aria-pressed="false" data-icon="palette">パレット番号</button>
<button data-view="position" aria-pressed="false" data-icon="ramp">ランプ位置</button>
</div>
<div id="debug-info" hidden><div id="debug-legend"></div><output id="pixel-info" aria-live="off">—</output></div>
<div class="canvas-metrics"><output id="timing" aria-live="off" title="直近のRGBA変換とCanvasへの転送にかかった時間。入力遅延やFPSではありません。">LUT変換＋転送 — ms</output></div>
<div class="paper"><canvas id="canvas" aria-label="お絵かきキャンバス"></canvas></div>
</section>
<aside>
<section aria-label="ブラシ設定"><h2><span data-icon="pen" aria-hidden="true"></span>ブラシ設定</h2><label title="サイズ"><span class="setting-name"><span data-icon="size" aria-hidden="true"></span>サイズ</span><input id="size" aria-label="サイズ" type="range" min="1" max="32" value="5"></label><label title="不透明度"><span class="setting-name"><span data-icon="opacity" aria-hidden="true"></span>不透明度</span><input id="opacity" aria-label="不透明度" type="range" min="0" max="100" value="100"></label><label title="筆圧でサイズを変える"><span class="setting-name"><span data-icon="pressure" aria-hidden="true"></span>筆圧でサイズを変える</span><input id="pressure" aria-label="筆圧でサイズを変える" type="checkbox" checked></label></section>
<section aria-label="パレット"><h2>パレット</h2><div id="palettes"></div><button id="addPalette" data-icon="palette" title="パレット追加" aria-label="パレット追加"><span>パレット追加</span></button></section>
<section aria-label="描画色"><h2>描画色</h2><label title="ランプ位置"><span class="setting-name"><span data-icon="ramp" aria-hidden="true"></span>ランプ位置</span><input id="position" aria-label="ランプ位置" type="range" min="0" max="255" value="128"></label><div id="ramp"></div></section>
<section aria-label="選択パレットの編集"><h2>パレット編集</h2><div id="colors"></div><div class="actions"><button id="addColor" data-icon="plus" title="色を追加" aria-label="色を追加"><span>色を追加</span></button><button id="removeColor" data-icon="minus" title="末尾の色を削除" aria-label="末尾の色を削除"><span>末尾の色を削除</span></button></div></section>
</aside>
</main><script src="lut-core.js"></script><script src="lut.js"></script>
</body></html>
